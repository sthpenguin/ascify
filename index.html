<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark" />
    <title>ascify — client-side retro media effects</title>
    <meta
      name="description"
      content="Turn images, GIFs, video, webcam and GLB models into ASCII art and 14 other retro effects. Everything runs on your device — your files never leave it."
    />
    <link rel="icon" type="image/svg+xml" href="/ascify/favicon.svg" />
    <link rel="apple-touch-icon" href="/ascify/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ascify" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta property="og:title" content="ascify" />
    <meta property="og:description" content="100% client-side retro media effects. Private by design." />
    <meta property="og:type" content="website" />
    <style>
      /* Painted before React mounts so the first frame is never a white flash. */
      html { background: #0a0a0a; color-scheme: dark; }
      body { margin: 0; background: #0a0a0a; color: #00ff00; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        font: 14px ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, monospace;
        color: #00ff00; letter-spacing: .08em;
      }
      #boot[hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">ascify :: initializing<span aria-hidden="true">_</span></div>
    <noscript>
      <p style="padding:2rem;font-family:monospace;color:#00ff00">
        ascify runs entirely in your browser and needs JavaScript enabled.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
