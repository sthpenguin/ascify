name: Deploy to GitHub Pages

# Manual-trigger only, deliberately.
#
# This account's plan cannot run GitHub Actions *or* GitHub Pages against a
# private repository. Both were verified directly:
#
#   POST /repos/OWNER/REPO/pages
#   -> 422 "Your current plan does not support GitHub Pages for this repository."
#
#   ...and every workflow run — including a six-line `echo hello` probe — ends
#   in `startup_failure` after 0s with no logs and no jobs created, which is
#   what GitHub returns when a private repository cannot consume Actions
#   minutes.
#
# So a push trigger here would mark every commit failed without ever running a
# step. The workflow itself is correct and was validated by building the same
# `dist/` locally; it is kept ready rather than removed.
#
# To deploy: make Actions and Pages available for this repository (make it
# public, or upgrade the account), re-enable the workflows
#
#   gh api -X PUT repos/OWNER/REPO/actions/workflows/deploy.yml/enable
#   gh api -X PUT repos/OWNER/REPO/actions/workflows/ci.yml/enable
#
# then add
#
#   push:
#     branches: [main]
#
# back under `on:`. Nothing else needs to change.
on:
  workflow_dispatch:

# GITHUB_TOKEN needs `pages: write` and `id-token: write` for deploy-pages to
# mint its OIDC deployment token; `contents: read` is all the checkout needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish; queued
# runs collapse to the newest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output
        # Catches a silently empty build before it is published.
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          echo "dist/ contains $(find dist -type f | wc -l) files"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
